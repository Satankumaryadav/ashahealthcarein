<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Asha Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../admin-assets/css/admin.css" />
  </head>
  <body>
    <header class="site-header admin-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="brand" aria-label="Back to Asha Healthcare website">
          <span class="brand-mark">+</span>
          <span class="brand-text">
            <strong>Asha</strong>
            <small>Healthcare.in</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Admin navigation">
          <a href="../index.html">Public Website</a>
          <a href="index.html" class="nav-button">Admin Home</a>
        </nav>
      </div>
    </header>

    <main id="adminLogin" class="admin-login">
      <div class="container narrow centered-content">
        <p class="eyebrow">Administrator sign in</p>
        <h1>Admin login</h1>
        <p class="muted">This admin dashboard is client-side only. Change default credentials after first login.</p>
        <form id="loginForm" class="admin-login-form">
          <label>
            Username
            <input name="username" type="text" required autocomplete="username" />
          </label>
          <label>
            Password
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <div class="form-actions">
            <button type="submit" class="button button-primary">Sign in</button>
          </div>
          <!-- <p class="muted small" id="loginNotice">Default: <strong> </strong> / <strong>Admin@123</strong></p> -->
        </form>
      </div>
    </main>

    <main id="adminApp" class="admin-app" hidden>
      <div class="container admin-grid">
        <aside class="admin-sidebar">
          <h2>Admin</h2>
          <nav class="admin-nav" aria-label="Admin sections">
            <button data-section="doctors" class="active">Doctors</button>
            <button data-section="services">Services</button>
          </nav>
          <p class="muted">Data saved locally in your browser (localStorage). No server required.</p>
        </aside>

        <section class="admin-main">
          <div id="section-doctors" class="admin-section">
            <div class="section-head">
              <h3>Doctors</h3>
              <button id="btnAddDoctor" class="button">Add doctor</button>
            </div>

            <div id="doctorsList" class="admin-list" aria-live="polite"></div>

            <form id="doctorForm" class="admin-form" hidden>
              <h4 id="doctorFormTitle">Add doctor</h4>
              <label>
                Name
                <input type="text" name="name" required />
              </label>
              <label>
                Specialty
                <input type="text" name="specialty" />
              </label>
              <label>
                Image URL
                <input type="url" name="image" placeholder="https://..." />
              </label>
              <label>
                Bio
                <textarea name="bio" rows="4"></textarea>
              </label>
              <div class="form-actions">
                <button type="submit" class="button button-primary">Save</button>
                <button type="button" id="cancelDoctor" class="button">Cancel</button>
              </div>
            </form>
          </div>

          <div id="section-services" class="admin-section" hidden>
            <div class="section-head">
              <h3>Services</h3>
              <button id="btnAddService" class="button">Add service</button>
            </div>

            <div id="servicesList" class="admin-list" aria-live="polite"></div>

            <form id="serviceForm" class="admin-form" hidden>
              <h4 id="serviceFormTitle">Add service</h4>
              <label>
                Title
                <input type="text" name="title" required />
              </label>
              <label>
                Category
                <input type="text" name="category" />
              </label>
              <label>
                Image URL
                <input type="url" name="image" placeholder="https://..." />
              </label>
              <label>
                Description
                <textarea name="description" rows="4"></textarea>
              </label>
              <div class="form-actions">
                <button type="submit" class="button button-primary">Save</button>
                <button type="button" id="cancelService" class="button">Cancel</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
    <script src="../admin-assets/js/supabase-config-client.js"></script>
    <script src="../admin-assets/js/supabase-client.js"></script>
    <script src="../assets/js/site-data.js" defer></script>
    <script src="../assets/js/admin-auth.js" defer></script>
    <script src="../assets/js/admin.js" defer></script>
  </body>
</html>
