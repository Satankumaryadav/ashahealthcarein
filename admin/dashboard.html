<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard | Asha Healthcare Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../admin-assets/css/admin.css" />
  </head>
  <body>
    <header class="site-header admin-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="brand" aria-label="Back to site">
          <span class="brand-mark">+</span>
          <span class="brand-text"><strong>Asha</strong><small>Healthcare.in</small></span>
        </a>
        <div>
          <a href="index.html" class="btn btn-outline-secondary btn-sm me-2">Admin Home</a>
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">Sign out</button>
        </div>
      </div>
    </header>

    <div class="container admin-grid">
      <aside class="admin-sidebar">
        <h5 class="mb-3">Website</h5>
        <nav class="nav flex-column admin-nav">
          <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
          <a class="nav-link" href="clinic-info.html"><i class="bi bi-building me-2"></i>Clinic Information</a>
          <a class="nav-link" href="home-page.html"><i class="bi bi-house me-2"></i>Home Page</a>
          <a class="nav-link" href="about-page.html"><i class="bi bi-info-circle me-2"></i>About Page</a>
          <a class="nav-link" href="doctors.html"><i class="bi bi-person-badge me-2"></i>Doctors</a>
          <a class="nav-link" href="services.html"><i class="bi bi-heart-pulse me-2"></i>Services</a>
          <a class="nav-link" href="facilities.html"><i class="bi bi-house-door me-2"></i>Facilities</a>
          <a class="nav-link" href="gallery.html"><i class="bi bi-images me-2"></i>Gallery</a>
          <a class="nav-link" href="media.html"><i class="bi bi-folder2-open me-2"></i>Media</a>
        </nav>
      </aside>

      <main class="admin-main">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2>Dashboard</h2>
          <div class="d-flex gap-2">
            <button class="btn btn-primary">+ Add Doctor</button>
            <button class="btn btn-outline-primary">+ Add Service</button>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-3">
            <div class="card p-3">
              <small class="muted">Doctors</small>
              <h3 id="statDoctors">—</h3>
              <a href="doctors.html" class="small">Manage</a>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <small class="muted">Services</small>
              <h3 id="statServices">—</h3>
              <a href="services.html" class="small">Manage</a>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <small class="muted">Facilities</small>
              <h3 id="statFacilities">—</h3>
              <a href="facilities.html" class="small">Manage</a>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <small class="muted">Gallery</small>
              <h3 id="statGallery">—</h3>
              <a href="gallery.html" class="small">Manage</a>
            </div>
          </div>
        </div>

        <section class="mt-4">
          <h4>Recent activity</h4>
          <div class="card p-3">
            <p class="muted">No recent activity to show.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
    <script src="../admin-assets/js/supabase-config-client.js"></script>
    <script src="../admin-assets/js/supabase-client.js"></script>
    <script src="../admin-assets/js/auth.js"></script>
    <script>
      // populate stats from localStorage / mock
      const data = JSON.parse(localStorage.getItem('clinic_data') || JSON.stringify(window.CLINIC_MOCK_DATA || {}));
      document.getElementById('statDoctors').textContent = (data.doctors||[]).length;
      document.getElementById('statServices').textContent = (data.services||[]).length;
      document.getElementById('statFacilities').textContent = (data.facilities||[]).length;
      document.getElementById('statGallery').textContent = (data.gallery||[]).length;

      document.getElementById('btnLogout').addEventListener('click', ()=>{
        localStorage.removeItem('clinic_admin_session');
        location.href = 'index.html';
      });
    </script>
  </body>
</html>
